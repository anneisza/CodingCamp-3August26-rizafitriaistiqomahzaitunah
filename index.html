<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpendTrack — Expense &amp; Budget Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="dark-theme">
    <div class="container">
      <header>
        <h1>💸 SpendTrack</h1>
        <p class="subtitle">Track your spending beautifully</p>
        <div id="balance-display" class="glass-card">
          <span class="balance-label">Total Spent</span>
          <span id="balance-amount">$0.00</span>
          <span id="tx-count">0 transactions</span>
        </div>
      </header>

      <main>
        <!-- Add Expense -->
        <section class="input-section glass-card">
          <p class="section-title" id="form-title">📝 Add Expense</p>
          <form id="transaction-form">
            <div class="field-group">
              <label for="item-name">Item Name</label>
              <input
                id="item-name"
                type="text"
                placeholder="e.g. Lunch"
                autocomplete="off"
              />
              <span id="error-name" class="error hidden" aria-live="polite"></span>
            </div>

            <div class="field-group">
              <label for="item-amount">Amount</label>
              <input
                id="item-amount"
                type="number"
                min="0.01"
                step="0.01"
                placeholder="e.g. 12.50"
              />
              <span id="error-amount" class="error hidden" aria-live="polite"></span>
            </div>

            <div class="field-group">
              <label for="item-category">Category</label>
              <select id="item-category">
                <option value="">Select category</option>
                <option value="Food">🍔 Food</option>
                <option value="Transport">🚌 Transport</option>
                <option value="Fun">🎉 Fun</option>
              </select>
              <span id="error-category" class="error hidden" aria-live="polite"></span>
            </div>

            <button type="submit" id="submit-btn">➕ Add Transaction</button>
            <button type="button" id="cancel-edit-btn" class="cancel-btn hidden">✕ Cancel</button>
          </form>
        </section>

        <!-- Spending Breakdown -->
        <section class="visual-section glass-card">
          <p class="section-title">📊 Spending Breakdown</p>
          <canvas
            id="spending-chart"
            aria-label="Spending distribution donut chart"
            role="img"
          ></canvas>
          <p id="chart-empty" class="hidden">No transactions yet.</p>
        </section>

        <!-- Recent Transactions -->
        <section class="list-section glass-card">
          <p class="section-title">🧾 Recent Transactions</p>
          <ul id="transaction-list"></ul>
          <p id="list-empty" class="hidden">No transactions added yet.</p>
        </section>
      </main>

      <div id="storage-warning" class="hidden">
        ⚠ Local Storage is unavailable. Data will not persist between sessions.
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
